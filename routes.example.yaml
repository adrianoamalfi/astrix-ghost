# Optional. Upload from Ghost Admin → Settings → Labs → Routes if you want a
# static home (home.hbs) with the blog living under /writing/.
#
# Without it, Ghost serves the post feed at / using home.hbs (page 1) and
# index.hbs for the paginated archive — which is what the four demo
# publications run.
#
# The custom page templates (Archive, Landing, Membership, Newsletter,
# Portfolio) are NOT wired through routes: assign them by page name in Ghost
# Admin (Settings → Pages → edit → Template). The Note template is a post
# template, selected per-post in the post editor.

routes:
  /:
    template: home
    data: page.home # create a page with slug "home" to feed content to home.hbs

# Posts tagged #photos (internal tag, slug hash-photos) are the photo posts:
# they get their own index at /photos/ (photos.hbs) and are filtered out of the
# ordinary collection BEFORE pagination, so pages stay full. Collections are
# matched in order and a post belongs to the first one whose filter matches, so
# keep /photos/ first. Both collections MUST share the same permalink, so adding
# or removing #photos never changes a post URL: below it is /writing/{slug}/,
# as for the ordinary collection. On a live site, copy your current routes and
# only add the /photos/ collection plus the tag:-hash-photos filter, using your
# existing permalink in both.
# The theme also filters tag and author archives, "Keep reading" and the
# previous/next links itself. Ghost's native search, RSS and sitemap are not
# affected: a #photos post is hidden from lists, not made private.
collections:
  /photos/:
    permalink: /writing/{slug}/
    template: photos
    filter: tag:hash-photos
  /writing/:
    permalink: /writing/{slug}/
    template: index
    filter: tag:-hash-photos

taxonomies:
  tag: /topic/{slug}/
  author: /author/{slug}/
